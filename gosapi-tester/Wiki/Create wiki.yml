info:
  name: Create wiki
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}pages.php?type=wiki"
  params:
    - name: type
      value: wiki
      type: query
  body:
    type: json
    data: '{"titel":"Test wiki","description":"x","visibility":"public"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
