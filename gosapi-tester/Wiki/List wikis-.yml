info:
  name: "List wikis\t"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}pages.php?type=wiki"
  headers:
    - name: URL
      value: "{{baseUrl}}"
  params:
    - name: type
      value: wiki
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
