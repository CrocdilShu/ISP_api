info:
  name: Lägg till Kommentar
  type: http
  seq: 2

http:
  method: POST
  url: https://gosapi.ddev.site/services/bloggapi.php?action=addComment
  params:
    - name: action
      value: addComment
      type: query
  body:
    type: json
    data: |-
      {
        "titel": "HEJ HEJ",
        "comment": "Din kommentarstext här"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
