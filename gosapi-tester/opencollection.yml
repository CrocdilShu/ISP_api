opencollection: 1.0.0

info:
  name: gosapi-tester
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{X-User-Token}}"
  variables:
    - name: baseUrl
      value: https://gosapi.ddev.site:8443/services/wiki/
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
